<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rewarded</title>
    <style>
      :root { color-scheme: light dark; --bg: #F7F6F2; --text: #1B1F24; --muted: #535B64; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0E1114; --text: #E8EAED; --muted: #A3ABB5; } }
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 16px; }
      main { max-width: 480px; }
      p { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Rewarded</h1>
      <p>Geen verbinding. Wat de server nodig heeft, staat even uit.</p>
      <p lang="en">No connection. Anything that needs the server is paused for now.</p>
    </main>
  </body>
</html>
